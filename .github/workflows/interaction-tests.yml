name: interaction-tests

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 22.13.0
  PNPM_VERSION: 11.19.0

jobs:
  playwright:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      ARE_BROWSER: ${{ matrix.browser }}
      ARE_PAGES_BASE_PATH: /are/
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download exact production candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run all viewport, touch, drag, scroll and raycast scenarios
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          overall=0

          run_profile() {
            export ARE_PROFILE="$1"
            export ARE_VIEWPORT_WIDTH="$2"
            export ARE_VIEWPORT_HEIGHT="$3"
            export ARE_DEVICE_SCALE_FACTOR="$4"
            export ARE_HAS_TOUCH='1'
            export ARE_IS_MOBILE='1'

            rm -rf playwright-report test-results interaction-artifacts flaky-tests.txt
            echo "::group::${ARE_BROWSER} · ${ARE_PROFILE}"

            if [ "$ARE_BROWSER" = firefox ]; then
              xvfb-run -a pnpm test:interaction --headed
            else
              pnpm test:interaction
            fi
            rc=$?

            node scripts/report-flaky.mjs playwright-report/results.json flaky-tests.txt || true
            node scripts/partition-playwright-artifacts.mjs || true

            dest="interaction-runs/${ARE_PROFILE}"
            mkdir -p "$dest"
            [ ! -d playwright-report ] || cp -R playwright-report "$dest/"
            [ ! -d test-results ] || cp -R test-results "$dest/"
            [ ! -d interaction-artifacts ] || cp -R interaction-artifacts "$dest/"
            [ ! -f flaky-tests.txt ] || cp flaky-tests.txt "$dest/"

            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              overall=1
            fi
          }

          run_profile mobile-320x568-dpr1 320 568 1
          run_profile mobile-360x800-dpr2 360 800 2
          run_profile mobile-390x844-dpr3 390 844 3
          run_profile mobile-430x932-dpr3 430 932 3
          run_profile tablet-portrait-768x1024-dpr2 768 1024 2
          run_profile tablet-landscape-1024x768-dpr2 1024 768 2

          exit "$overall"
      - name: Upload grouped browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-${{ matrix.browser }}
          path: interaction-runs
          if-no-files-found: ignore
          retention-days: 14
