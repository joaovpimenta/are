name: Quality Audit (Manual)

on:
  workflow_dispatch:
    inputs:
      scope_override:
        description: 'Optional override for project QLTY_SCOPE'
        required: false
        default: 'full'
        type: choice
        options:
          - project-default
          - full
          - pr
      enforcement_override:
        description: 'Optional override for project QLTY_ENFORCEMENT'
        required: false
        default: 'report-only'
        type: choice
        options:
          - project-default
          - report-only
          - standard
          - strict

concurrency:
  group: quality-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: joaovpimenta/joaovpimenta/.github/workflows/quality.yml@qlty-v0.2.0
    with:
      scope_override: ${{ inputs.scope_override != 'project-default' && inputs.scope_override || '' }}
      enforcement_override: ${{ inputs.enforcement_override != 'project-default' && inputs.enforcement_override || '' }}
